# Бесконтактное заселение: n8n + PostgreSQL + Cloudflare Tunnel (эпизод 44, пример, не проверен на живом сервере).
# Теги образов закрепите после первого успешного запуска (docker compose images) и сверьте с официальной документацией.
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pg_data:/var/lib/postgresql/data          # постоянный том: без него база исчезнет при пересоздании контейнера
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

  n8n:
    image: docker.n8n.io/n8nio/n8n:latest
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_PORT: 5432
      DB_POSTGRESDB_DATABASE: ${POSTGRES_DB}
      DB_POSTGRESDB_USER: ${POSTGRES_USER}
      DB_POSTGRESDB_PASSWORD: ${POSTGRES_PASSWORD}
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY}   # задать один раз и не менять: им шифруются ключи подключений
      N8N_HOST: ${HOST}
      N8N_PROTOCOL: https
      WEBHOOK_URL: https://${HOST}/
      GENERIC_TIMEZONE: ${TZ}
      TZ: ${TZ}
      N8N_RESTRICT_FILE_ACCESS_TO: /data/scans    # запись файлов только в эту папку (проверьте имя переменной в документации вашей версии)
    volumes:
      - n8n_data:/home/node/.n8n
      - ${SCANS_DIR}:/data/scans                  # папка на ЗАШИФРОВАННОМ томе сервера (LUKS или шифрование диска провайдера)

  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN}                # токен туннеля из панели Cloudflare Zero Trust; маршрут: ваш домен -> http://n8n:5678
    depends_on:
      - n8n

volumes:
  pg_data:
  n8n_data:
